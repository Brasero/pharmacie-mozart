// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.1'
        classpath 'com.google.gms:google-services:4.3.10'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Compatibilité Gradle moderne pour certains anciens scripts Cordova/Android
    // qui appellent `module("group:artifact:version")` dans un bloc dependencies.
    // Sur les versions récentes, cette méthode n'existe plus sur DependencyHandler.
    dependencies.metaClass.module = { Object notation ->
        notation
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
